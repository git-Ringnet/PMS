<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost & Found</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#f0f2f5;--white:#fff;--border:#dde2ea;--border2:#c8d0dc;
  --accent:#2f6fed;--text:#1a2638;--text2:#536b8a;--text3:#8fa3be;
  --red:#e53935;--green:#16a34a;--row-h:#f5f8ff;
  --radius:6px;--shadow:0 1px 4px rgba(0,0,0,.08);--shadow-md:0 6px 28px rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 'Segoe UI',sans-serif;min-height:100vh}
.page{display:flex;flex-direction:column;height:100vh}

/* TOPBAR */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 20px;height:46px;display:flex;align-items:center;flex-shrink:0;box-shadow:var(--shadow)}
.topbar-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.topbar-title i{color:var(--accent)}
.spacer{flex:1}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--radius);font:600 12px/1 'Segoe UI',sans-serif;border:none;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:#f0f4fa;opacity:1}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-icon{padding:5px 8px;font-size:12px}

/* CONTENT */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:14px 16px;gap:10px}

/* FILTER BAR */
.filter-bar{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:var(--shadow)}
.filter-bar label{font-size:11px;color:var(--text);white-space:nowrap}
.filter-bar select{height:30px;border:1px solid var(--border2);border-radius:var(--radius);font:12.5px 'Segoe UI',sans-serif;color:var(--text);padding:0 8px;outline:none;background:var(--white);cursor:pointer}
.filter-bar select:focus{border-color:var(--accent)}
/* Date input styled */
.date-input{position:relative;display:inline-flex;align-items:center}
.date-input input[type=date]{height:30px;border:1px solid var(--border2);border-radius:var(--radius);font:12.5px 'Segoe UI',sans-serif;color:var(--text);padding:0 8px;outline:none;background:var(--white);width:132px;cursor:pointer}
.date-input input[type=date]:focus{border-color:var(--accent)}
.date-input input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6}
.filter-sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.f-search{flex:1;min-width:160px;height:30px;border:1px solid var(--border2);border-radius:var(--radius);font:12.5px 'Segoe UI',sans-serif;color:var(--text);padding:0 10px;outline:none;background:var(--white)}
.f-search:focus{border-color:var(--accent)}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:12px;font:600 11px/1.6 'Segoe UI',sans-serif}
.badge-lost{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5}
.badge-found{background:#f0fdf4;color:#16a34a;border:1px solid #86efac}

/* TABLE */
.table-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;flex:1;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:960px}
thead{position:sticky;top:0;z-index:2}
th{background:#f5f7fb;border-bottom:2px solid var(--border2);padding:8px 10px;text-align:left;font:600 11px 'Segoe UI',sans-serif;color:var(--text);white-space:nowrap;user-select:none}
th.center,td.center{text-align:center}
td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--row-h)}
.col-ma{font-weight:600;color:var(--accent)}
.col-date,.col-user,.col-khu{color:var(--text)}
.act-btns{display:flex;gap:4px;justify-content:center}
.empty-row td{text-align:center;padding:40px;color:var(--text3)}

/* PAGER */
.pager{display:flex;align-items:center;gap:5px}
.pager button{height:26px;min-width:26px;padding:0 6px;border:1px solid var(--border2);border-radius:3px;background:var(--white);color:var(--text2);cursor:pointer;font-size:11px}
.pager button:hover{background:#f0f4fa}
.pager button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(20,30,50,.4);display:flex;align-items:center;justify-content:center;z-index:1000}
.overlay.hidden{display:none}

/* MODAL BOX */
.modal-box{border-radius:10px;width:800px;max-width:97vw;max-height:93vh;display:flex;flex-direction:column;box-shadow:var(--shadow-md);overflow:hidden}

/* MODAL HEADER — navy, guaranteed */
.mhd{background-color:#1e2d4a;padding:11px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.mhd-icon{color:#7a9bbf;font-size:14px;flex-shrink:0}
.mhd-title{color:#ffffff;font-size:13.5px;font-weight:700;flex:1;line-height:1.3}
.mhd-close{background:transparent;border:none;color:#7a9bbf;font-size:16px;cursor:pointer;padding:2px 7px;border-radius:4px;line-height:1;display:flex;align-items:center;justify-content:center}
.mhd-close:hover{background:rgba(255,255,255,.14);color:#fff}

.modal-body{overflow-y:auto;flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:14px;background:#fff}
.modal-foot{padding:11px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;background:#fff}

/* STATUS PICK */
.status-pick{display:flex;gap:10px}
.status-opt{display:flex;align-items:center;gap:7px;padding:7px 16px;border:1.5px solid var(--border2);border-radius:var(--radius);cursor:pointer;font:600 12.5px 'Segoe UI',sans-serif;color:var(--text2);transition:all .15s;user-select:none}
.status-opt:hover{border-color:var(--accent)}
.sel-lost{border-color:var(--red)!important;background:#fff5f5!important;color:var(--red)!important}
.sel-found{border-color:var(--green)!important;background:#f0fdf4!important;color:var(--green)!important}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--border2);flex-shrink:0;display:inline-block}
.sel-lost .sdot{background:var(--red)}
.sel-found .sdot{background:var(--green)}

/* FORM */
.form-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.form-col{display:flex;flex-direction:column;gap:10px}
.sec-ttl{font-size:11px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.05em;padding-bottom:5px;border-bottom:1.5px solid var(--border)}
.fg{display:flex;flex-direction:column;gap:3px}
.fg > label{font-size:11.5px;color:var(--text);font-weight:600}
.req{color:var(--red);margin-left:2px}
.hint{font-size:10px;color:var(--text3);font-weight:400;margin-left:4px}
.fg input[type=text],.fg input[type=date],.fg select,.fg textarea{
  height:34px;border:1px solid var(--border2);border-radius:var(--radius);
  font:12.5px 'Segoe UI',sans-serif;color:var(--text);padding:0 10px;outline:none;background:#fff;
  transition:border-color .15s,box-shadow .15s;width:100%;
}
.fg input[type=text]:focus,.fg input[type=date]:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.1)}
.fg textarea{height:68px;padding:7px 10px;resize:vertical}
.fg select{cursor:pointer}
.fg input[readonly]{background:#f7f8fb;color:var(--text2)}
.fg input[type=date]{color-scheme:light;cursor:pointer}
.fg input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* IMG */
.img-zone{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:10px;min-height:78px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.img-thumb{width:62px;height:62px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:zoom-in}
.img-add-btn{width:62px;height:62px;border-radius:4px;border:1px dashed var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);font-size:10px;gap:3px;cursor:pointer;transition:border-color .15s,color .15s}
.img-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.img-add-btn i{font-size:16px}
.img-wrap{position:relative}
.img-del{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:var(--red);border:none;color:#fff;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:2000;cursor:zoom-out}
.lightbox.hidden{display:none}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:4px}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#d0d7e3;border-radius:4px}
</style>
</head>
<body>
<div class="page">
  <div class="topbar" style="background-color:#1e2d4a;border-bottom:none;">
    <div class="topbar-title" style="color:#fff;"><i class="fa-solid fa-box-archive" style="color:#7a9bbf;"></i> Quản lý đồ thất lạc (Lost &amp; Found)</div>
  </div>

  <div class="content">
    <!-- FILTER -->
    <div class="filter-bar">
      <label>Tình trạng</label>
      <select id="fStatus" onchange="renderTable()" style="width:110px">
        <option value="">Tất cả</option>
        <option value="lost">Lost</option>
        <option value="found">Found</option>
      </select>
      <div class="filter-sep"></div>
      <label>Từ ngày</label>
      <div class="date-input"><input type="date" id="fFrom" onchange="onFromChange()"></div>
      <label>Đến ngày</label>
      <div class="date-input"><input type="date" id="fTo" onchange="renderTable()"></div>
      <div class="filter-sep"></div>
      <input type="text" class="f-search" id="fSearch" placeholder="Tên khách, mặt hàng, địa điểm..." oninput="renderTable()">
      <button class="btn btn-ghost btn-sm" onclick="clearFilters()"><i class="fa-solid fa-rotate-left"></i> Đặt lại</button>
      <button class="btn btn-primary" style="padding:6px 14px;height:34px;" onclick="openModal('new')"><i class="fa-solid fa-plus"></i> Thêm phiếu</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:34px" class="center">#</th>
          <th>Tình trạng</th><th>Thông tin khách</th><th>Mặt hàng</th>
          <th>Ngày báo cáo</th><th>Ngày tìm thấy</th><th>Người tìm thấy</th>
          <th>Khu vực</th><th>Kho</th><th>Ngày nhận</th><th>Người giao</th><th>Người nhận</th>
          <th>User tạo</th><th class="center" style="width:70px">Thao tác</th>
        </tr></thead>
        <tbody id="tbodyMain"></tbody>
      </table>
    </div>

    <!-- PAGER -->
    <div style="display:flex;align-items:center;flex-shrink:0">
      <span id="pageInfo" style="font-size:12px;color:var(--text2)"></span>
      <div class="spacer"></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay hidden" id="overlay" onclick="outsideClose(event)">
  <div class="modal-box" onclick="event.stopPropagation()">

    <div style="background-color:#1e2d4a;padding:11px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;">
      <i class="fa-solid fa-file-lines" style="color:#7a9bbf;font-size:14px;flex-shrink:0;"></i>
      <span id="modalTitle" style="color:#ffffff;font-size:13.5px;font-weight:700;flex:1;line-height:1.3;">Thêm phiếu Lost &amp; Found</span>
      <button onclick="closeModal()" style="background:transparent;border:none;color:#7a9bbf;font-size:17px;cursor:pointer;padding:2px 7px;border-radius:4px;line-height:1;display:flex;align-items:center;" onmouseover="this.style.background='rgba(255,255,255,.15)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='#7a9bbf'"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="modal-body">
      <div class="status-pick">
        <div class="status-opt" id="optLost" onclick="pickStatus('lost')"><span class="sdot"></span> Lost (thất lạc)</div>
        <div class="status-opt" id="optFound" onclick="pickStatus('found')"><span class="sdot"></span> Found (tìm thấy)</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <!-- THÔNG TIN CHUNG -->
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="sec-ttl">Thông tin chung</div>
          <div class="row2">
            <div class="fg"><label>Ngày báo cáo <span class="req">*</span></label><input type="date" id="f_ngay_bc"></div>
            <div class="fg"><label>Thông tin khách</label><input type="text" id="f_khach" placeholder="Tên, số phòng, điện thoại..."></div>
          </div>
          <div class="fg"><label>Mặt hàng <span class="req">*</span></label><input type="text" id="f_hang" placeholder="VD: iPhone 15, Ví da nâu..."></div>
          <div class="row2">
            <div class="fg"><label>Ngày tìm thấy</label><input type="date" id="f_ngay_tim"></div>
            <div class="fg"><label>Người tìm thấy</label><input type="text" id="f_nguoi_tim"></div>
          </div>
          <div class="fg"><label>Địa điểm tìm thấy</label><input type="text" id="f_diachi"></div>
          <div class="row2">
            <div class="fg"><label>Kho lưu trữ</label><input type="text" id="f_kho"></div>
            <div class="fg"><label>Ghi chú</label><input type="text" id="f_ghichu" placeholder="Mô tả thêm, đặc điểm nhận dạng..."></div>
          </div>
        </div>

        <!-- THÔNG TIN GIAO NHẬN -->
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="sec-ttl">Thông tin giao nhận</div>
          <div class="row2">
            <div class="fg"><label>Ngày nhận</label><input type="date" id="f_ngay_nhan"></div>
            <div class="fg"><label>Phương thức xử lý</label><input type="text" id="f_phuongthuc"></div>
          </div>
          <div class="row2">
            <div class="fg"><label>Người giao</label><input type="text" id="f_nguoi_giao" placeholder="Người bàn giao đồ vật..."></div>
            <div class="fg"><label>Người nhận</label><input type="text" id="f_nguoi_nhan"></div>
          </div>
        </div>

        <!-- HÌNH ẢNH -->
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="sec-ttl">Hình ảnh đồ vật</div>
          <div class="img-zone" id="imgZone"></div>
          <input type="file" id="imgFile" accept="image/*" multiple style="display:none" onchange="handleImg(event)">
        </div>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Huỷ</button>
      <button class="btn btn-primary" id="btnSave" onclick="saveRecord()"><i class="fa-solid fa-plus"></i> Thêm</button>
    </div>
  </div>
</div>

<div class="lightbox hidden" id="lightbox" onclick="this.classList.add('hidden')">
  <img id="lbImg" src="" alt="">
</div>

<script>
// Ngày local (tránh UTC lệch múi giờ)
function localDate(d){
  d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// yyyy-mm-dd → dd/mm/yyyy để hiển thị trong bảng
function fmt(ymd){if(!ymd)return'';const[y,m,d]=ymd.split('-');return d+'/'+m+'/'+y;}


const TODAY=localDate();

let db=[
  {id:1,status:'found',khach:'David Nguyen – Phòng 302',hang:'Máy tính bảng iPad mini',ngay_bc:TODAY,ngay_tim:TODAY,nguoi_tim:'Trần Thị Bình',diachi:'Sảnh tầng 1',kho:'Tủ FO số 1',ghichu:'Màu xám, không có bao da',ngay_nhan:'',phuongthuc:'',nguoi_giao:'',nguoi_nhan:'',images:[],user:'admin'},
  {id:2,status:'lost',khach:'Trần Thị Hoa – Phòng 401',hang:'Ví đầm màu đỏ',ngay_bc:TODAY,ngay_tim:'',nguoi_tim:'',diachi:'Nhà hàng tầng 1',kho:'',ghichu:'',ngay_nhan:'',phuongthuc:'',nguoi_giao:'',nguoi_nhan:'',images:[],user:'letan01'},
  {id:3,status:'found',khach:'Nguyễn Thị Lan – Phòng 101',hang:'iPhone 15 Pro màu đen',ngay_bc:'2026-07-14',ngay_tim:'2026-07-14',nguoi_tim:'Lê Thị Mai',diachi:'Phòng 101',kho:'Tủ FO số 1',ghichu:'Không có case, pin ~60%',ngay_nhan:'',phuongthuc:'',nguoi_giao:'',nguoi_nhan:'',images:[],user:'admin'},
  {id:4,status:'found',khach:'Trần Minh Tuấn – Phòng 102',hang:'Ví da màu nâu',ngay_bc:'2026-07-10',ngay_tim:'2026-07-10',nguoi_tim:'Phạm Minh Tuấn',diachi:'Sảnh lễ tân',kho:'Két an toàn',ghichu:'',ngay_nhan:'2026-07-11',phuongthuc:'Trực tiếp',nguoi_giao:'Lê Thị Hương',nguoi_nhan:'Trần Hương',images:[],user:'letan01'},
  {id:5,status:'lost',khach:'',hang:'Áo khoác xanh navy Uniqlo',ngay_bc:'2026-07-16',ngay_tim:'',nguoi_tim:'',diachi:'Nhà hàng tầng 2',kho:'Kho HK',ghichu:'Size L',ngay_nhan:'',phuongthuc:'',nguoi_giao:'',nguoi_nhan:'',images:[],user:'hk01'},
];
let nextId=6,editId=null,editImgs=[],pickedStatus='found';
const PAGE_SIZE=10;let curPage=1;

// FILTER
function onFromChange(){
  const fr=document.getElementById('fFrom').value;
  const toEl=document.getElementById('fTo');
  if(fr&&(!toEl.value||toEl.value<fr))toEl.value=fr;
  renderTable();
}

function filtered(){
  const st=document.getElementById('fStatus').value;
  const fr=document.getElementById('fFrom').value;
  const to=document.getElementById('fTo').value;
  const q=document.getElementById('fSearch').value.toLowerCase();
  return db.filter(r=>
    (!st||r.status===st)&&
    (!fr||r.ngay_bc>=fr)&&
    (!to||r.ngay_bc<=to)&&
    (!q||[r.khach,r.hang,r.diachi].some(v=>(v||'').toLowerCase().includes(q)))
  );
}

function renderTable(){
  const rows=filtered(),total=rows.length;
  const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(curPage>pages)curPage=pages;
  const slice=rows.slice((curPage-1)*PAGE_SIZE,curPage*PAGE_SIZE);
  const tb=document.getElementById('tbodyMain');
  if(!slice.length){
    tb.innerHTML='<tr class="empty-row"><td colspan="14"><i class="fa-regular fa-inbox" style="font-size:28px;display:block;margin-bottom:6px"></i>Không có dữ liệu</td></tr>';
  }else{
    tb.innerHTML=slice.map((r,i)=>`<tr>
      <td class="center" style="color:var(--text)">${(curPage-1)*PAGE_SIZE+i+1}</td>
      <td><span class="badge badge-${r.status}">${r.status==='lost'?'Lost':'Found'}</span></td>
      <td>${r.khach||''}</td><td>${r.hang}</td>
      <td class="col-date">${fmt(r.ngay_bc)}</td>
      <td class="col-date">${fmt(r.ngay_tim)}</td>
      <td class="col-user">${r.nguoi_tim||''}</td>
      <td class="col-khu">${r.diachi||''}</td>
      <td>${r.kho||''}</td>
      <td class="col-date">${fmt(r.ngay_nhan)}</td>
      <td class="col-user">${r.nguoi_giao||''}</td>
      <td class="col-user">${r.nguoi_nhan||''}</td>
      <td class="col-user">${r.user}</td>
      <td class="center"><div class="act-btns">
        <button class="btn btn-ghost btn-icon" onclick="openModal('edit',${r.id})" title="Sửa"><i class="fa-regular fa-pen-to-square"></i></button>
        <button class="btn btn-danger btn-icon" onclick="delRecord(${r.id})" title="Xoá"><i class="fa-regular fa-trash-can"></i></button>
      </div></td>
    </tr>`).join('');
  }
  document.getElementById('pageInfo').textContent='Hiển thị '+slice.length+' / '+total+' phiếu';
  renderPager(pages);
}

function renderPager(pages){
  const p=document.getElementById('pager');p.innerHTML='';
  const mk=(lbl,pg,act)=>{const b=document.createElement('button');b.innerHTML=lbl;if(act)b.classList.add('active');b.onclick=()=>{curPage=pg;renderTable();};p.appendChild(b);};
  mk('<i class="fa-solid fa-angle-left"></i>',Math.max(1,curPage-1),false);
  for(let i=1;i<=pages;i++)mk(i,i,i===curPage);
  mk('<i class="fa-solid fa-angle-right"></i>',Math.min(pages,curPage+1),false);
}

function clearFilters(){
  document.getElementById('fFrom').value=TODAY;
  document.getElementById('fTo').value=TODAY;
  document.getElementById('fStatus').value='';
  document.getElementById('fSearch').value='';
  curPage=1;renderTable();
}

// MODAL
function pickStatus(s){
  pickedStatus=s;
  document.getElementById('optLost').className='status-opt'+(s==='lost'?' sel-lost':'');
  document.getElementById('optFound').className='status-opt'+(s==='found'?' sel-found':'');
}

function openModal(mode,id){
  editImgs=[];editId=null;
  if(mode==='new'){
    document.getElementById('modalTitle').textContent='Thêm phiếu Lost & Found';
    document.getElementById('btnSave').innerHTML='<i class="fa-solid fa-plus"></i> Thêm';
    ['f_khach','f_hang','f_nguoi_tim','f_diachi','f_kho','f_ghichu','f_nguoi_nhan','f_nguoi_giao','f_phuongthuc'].forEach(x=>document.getElementById(x).value='');
    document.getElementById('f_ngay_bc').value=TODAY;
    document.getElementById('f_ngay_tim').value='';
    document.getElementById('f_ngay_nhan').value='';
    pickStatus('lost');
  }else{
    const r=db.find(x=>x.id===id);if(!r)return;
    editId=id;
    document.getElementById('modalTitle').textContent='Chỉnh sửa phiếu';
    document.getElementById('btnSave').innerHTML='<i class="fa-solid fa-floppy-disk"></i> Lưu';
    document.getElementById('f_khach').value=r.khach||'';
    document.getElementById('f_hang').value=r.hang;
    document.getElementById('f_ngay_bc').value=r.ngay_bc;
    document.getElementById('f_ngay_tim').value=r.ngay_tim||'';
    document.getElementById('f_nguoi_tim').value=r.nguoi_tim||'';
    document.getElementById('f_diachi').value=r.diachi||'';
    document.getElementById('f_kho').value=r.kho||'';
    document.getElementById('f_ghichu').value=r.ghichu||'';
    document.getElementById('f_ngay_nhan').value=r.ngay_nhan||'';
    document.getElementById('f_phuongthuc').value=r.phuongthuc||'';
    document.getElementById('f_nguoi_nhan').value=r.nguoi_nhan||'';
    document.getElementById('f_nguoi_giao').value=r.nguoi_giao||'';
    editImgs=[...(r.images||[])];
    pickStatus(r.status);
  }
  renderImgZone();
  document.getElementById('overlay').classList.remove('hidden');
}

function closeModal(){document.getElementById('overlay').classList.add('hidden');}
function outsideClose(e){if(e.target===document.getElementById('overlay'))closeModal();}

function handleImg(e){
  [...e.target.files].forEach(f=>{const r=new FileReader();r.onload=ev=>{editImgs.push(ev.target.result);renderImgZone();};r.readAsDataURL(f);});
  e.target.value='';
}

function renderImgZone(){
  const z=document.getElementById('imgZone');z.innerHTML='';
  editImgs.forEach((src,i)=>{
    const w=document.createElement('div');w.className='img-wrap';
    const img=document.createElement('img');img.className='img-thumb';img.src=src;
    img.onclick=()=>{document.getElementById('lbImg').src=src;document.getElementById('lightbox').classList.remove('hidden');};
    const del=document.createElement('button');del.className='img-del';del.innerHTML='<i class="fa-solid fa-xmark"></i>';
    del.onclick=()=>{editImgs.splice(i,1);renderImgZone();};
    w.appendChild(img);w.appendChild(del);z.appendChild(w);
  });
  const add=document.createElement('div');add.className='img-add-btn';
  add.innerHTML='<i class="fa-solid fa-camera"></i><span>Thêm ảnh</span>';
  add.onclick=()=>document.getElementById('imgFile').click();
  z.appendChild(add);
}

function saveRecord(){
  const hang=document.getElementById('f_hang').value.trim();
  const ngay_bc=document.getElementById('f_ngay_bc').value;
  if(!hang||!ngay_bc){alert('Vui lòng điền: Mặt hàng và Ngày báo cáo');return;}
  const payload={
    status:pickedStatus,hang,ngay_bc,
    khach:document.getElementById('f_khach').value.trim(),
    ngay_tim:document.getElementById('f_ngay_tim').value,
    nguoi_tim:document.getElementById('f_nguoi_tim').value.trim(),
    diachi:document.getElementById('f_diachi').value.trim(),
    kho:document.getElementById('f_kho').value.trim(),
    ghichu:document.getElementById('f_ghichu').value.trim(),
    ngay_nhan:document.getElementById('f_ngay_nhan').value,
    phuongthuc:document.getElementById('f_phuongthuc').value.trim(),
    nguoi_giao:document.getElementById('f_nguoi_giao').value.trim(),
    nguoi_nhan:document.getElementById('f_nguoi_nhan').value.trim(),
    images:[...editImgs],user:'admin',
  };
  if(editId){const i=db.findIndex(x=>x.id===editId);if(i>-1)db[i]={...db[i],...payload};}
  else db.unshift({id:nextId++,...payload});
  closeModal();curPage=1;renderTable();
}

function delRecord(id){
  if(!confirm('Xoá phiếu này?'))return;
  db=db.filter(x=>x.id!==id);renderTable();
}

document.getElementById('fTo').value=TODAY;
renderTable();
</script>
